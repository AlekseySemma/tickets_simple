services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: change_me_strong
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tickets:change_me_strong@db:5432/tickets
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /data/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_PRESIGNED_TTL_SECONDS: ${S3_PRESIGNED_TTL_SECONDS:-3600}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: /app/private_key.pem
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
      - ./private_key.pem:/app/private_key.pem:ro

volumes:
  pgdata:
    name: tickets_pgdata
  uploads:
    name: tickets_uploads

