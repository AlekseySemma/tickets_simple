<html>
<head>
  <meta charset="utf-8" />
  <title>Типы заявок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d6efd">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">Типы заявок</h3>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary position-relative" href="/web/notifications">Уведомления<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger d-none" data-notifications-badge></span></a>
        <a class="btn btn-outline-secondary" href="/web">Заявки</a>
        <a class="btn btn-outline-danger" href="/web/logout">Выйти</a>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="mb-3">Добавить тип заявки</h5>
        <form method="post" action="/web/ticket-types/create" class="row g-2">
          <div class="col-12 col-md-5">
            <input name="name" class="form-control" placeholder="Название" required />
          </div>
          <div class="col-12 col-md-5">
            <input name="description" class="form-control" placeholder="Описание (необязательно)" />
          </div>
          <div class="col-12 col-md-2 d-flex align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" value="1" id="is_active_new" checked>
              <label class="form-check-label" for="is_active_new">Активен</label>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-primary">Создать</button>
          </div>
        </form>
      </div>
    </div>

    {% for tt in ticket_types %}
      <div class="card shadow-sm mb-2">
        <div class="card-body">
          <form method="post" action="/web/ticket-types/{{ tt.id }}/update" class="row g-2">
            <div class="col-12 col-md-4">
              <label class="form-label">Название</label>
              <input name="name" class="form-control" value="{{ tt.name }}" required />
            </div>
            <div class="col-12 col-md-5">
              <label class="form-label">Описание</label>
              <input name="description" class="form-control" value="{{ tt.description or '' }}" />
            </div>
            <div class="col-12 col-md-3 d-flex align-items-end">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="is_active" value="1" id="active_{{ tt.id }}" {% if tt.is_active %}checked{% endif %}>
                <label class="form-check-label" for="active_{{ tt.id }}">Активен</label>
              </div>
            </div>
            <div class="col-12 d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary" type="submit">Сохранить</button>
            </div>
          </form>
          <form class="mt-2" method="post" action="/web/ticket-types/{{ tt.id }}/delete" onsubmit="return confirm('Удалить тип заявки {{ tt.name }}?');">
                <button class="btn btn-sm btn-outline-danger" type="submit">Удалить</button>
          </form>
        </div>
      </div>
    {% endfor %}

    {% if ticket_types|length == 0 %}
      <div class="alert alert-info">Типов заявок пока нет.</div>
    {% endif %}
  </div>
  <script src="/static/sw-register.js"></script>
  <script src="/static/notifications-widget.js"></script>
</body>
</html>
