<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Новый пароль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f9d8f">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/service-theme.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5 service-shell auth-shell" style="max-width: 560px;">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <div class="auth-brand">servora</div>
        <h3 class="mb-3">Новый пароль</h3>

        {% if success %}
          <div class="alert alert-success">Пароль обновлён. Теперь можно войти с новым паролем.</div>
          <a class="btn btn-primary w-100" href="/web/login">Перейти ко входу</a>
        {% else %}
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          {% if token %}
            <form method="post" action="/web/password-reset/confirm">
              <input type="hidden" name="token" value="{{ token }}" />
              <div class="mb-3">
                <label class="form-label">Новый пароль</label>
                <input name="password" type="password" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Повторите пароль</label>
                <input name="password_confirm" type="password" class="form-control" required />
              </div>
              <button class="btn btn-primary w-100" type="submit">Сохранить пароль</button>
            </form>
          {% else %}
            <a class="btn btn-outline-primary w-100" href="/web/password-reset">Запросить новую ссылку</a>
          {% endif %}
        {% endif %}
      </div>
    </div>
  </div>
  <script src="/static/sw-register.js"></script>
</body>
</html>
