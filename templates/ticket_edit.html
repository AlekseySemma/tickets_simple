<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Редактирование заявки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d6efd">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .page-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    @media (max-width: 991.98px) {
      .container {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
    @media (max-width: 575.98px) {
      .page-actions .btn {
        flex: 1 1 auto;
        min-width: 120px;
      }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 900px;">
    <div class="page-head mb-3">
      <h3 class="mb-0">Редактирование заявки #{{ t.id }}</h3>
      <div class="page-actions">
        <a class="btn btn-outline-secondary position-relative" href="/web/notifications">Уведомления<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger d-none" data-notifications-badge></span></a>
        <a class="btn btn-outline-secondary" href="{{ next_url }}">Назад</a>
        <a class="btn btn-outline-danger" href="/web/logout">Выйти</a>
      </div>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" action="/web/tickets/{{ t.id }}/edit" class="row g-3">
          <input type="hidden" name="next" value="{{ next_url }}">
          {% if can_edit_full %}
            <div class="col-12 col-md-6">
              <label class="form-label">Название</label>
              <input name="title" class="form-control ticket-title-input" value="{{ t.title }}" required maxlength="{{ max_ticket_title_len }}" data-title-limit="{{ max_ticket_title_len }}" data-counter-target="edit-title-counter" />
              <div class="d-flex justify-content-end mt-1">
                <small id="edit-title-counter" class="text-muted">0/{{ max_ticket_title_len }}</small>
              </div>
              <div class="invalid-feedback">
                Название слишком длинное. Максимум: {{ max_ticket_title_len }} символов.
              </div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Проект</label>
              <select name="project_id" class="form-select" required>
                {% for p in projects %}
                  <option value="{{ p.id }}" {% if p.id == t.project_id %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Тип заявки</label>
              <select name="ticket_type_id" class="form-select">
                <option value="">— не выбран —</option>
                {% for tt in ticket_types %}
                  <option value="{{ tt.id }}" {% if t.ticket_type_id == tt.id %}selected{% endif %}>
                    {{ tt.name }}{% if not tt.is_active %} (inactive){% endif %}
                  </option>
                {% endfor %}
              </select>
            </div>
          {% endif %}

          <div class="col-12">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="4">{{ t.description or "" }}</textarea>
          </div>

          <div class="col-12 col-md-6">
  <label class="form-label">Срок: дата</label>
  <input id="deadline_date" name="deadline_date" type="date" class="form-control"
         value="{{ deadline_date or '' }}" />
</div>

<div class="col-12 col-md-6">
  <label class="form-label">Время (HHMM)</label>
  <div class="input-group">
    <input id="deadline_time4" name="deadline_time4" class="form-control"
           inputmode="numeric" maxlength="4"
           value="{{ deadline_time4 or '' }}"
           placeholder="например 9, 930, 1745" />
    <span class="input-group-text" id="deadline_time_pretty">--:--</span>
  </div>
</div>


          {% if can_edit_full %}
            <div class="col-12 col-md-6">
              <label class="form-label">Исполнитель</label>
              <select name="executor_id" class="form-select">
                <option value="">— не назначен —</option>
                {% for e in executors %}
                  <option value="{{ e.id }}" {% if t.executor_id == e.id %}selected{% endif %}>{{ e.name }} ({{ e.email }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Статус</label>
              <select name="status" class="form-select">
  <option value="NEW" {% if t.status.value == "NEW" %}selected{% endif %}>Новая</option>
  <option value="IN_PROGRESS" {% if t.status.value == "IN_PROGRESS" %}selected{% endif %}>В работе</option>
  <option value="DONE" {% if t.status.value == "DONE" %}selected{% endif %}>Выполнена</option>
  <option value="CANCELED" {% if t.status.value == "CANCELED" %}selected{% endif %}>Отменена</option>
</select>
            </div>
          {% endif %}
            
          <div class="col-12 d-flex gap-2 flex-column flex-sm-row">
            <button class="btn btn-primary" type="submit">Сохранить</button>
            <a class="btn btn-outline-secondary" href="{{ next_url }}">Отмена</a>
          </div>

        </form>
      </div>
    </div>
  </div>

<script>
  (function () {
    const dateEl = document.getElementById("deadline_date");
    const timeEl = document.getElementById("deadline_time4");
    const prettyEl = document.getElementById("deadline_time_pretty");
    if (!dateEl || !timeEl || !prettyEl) return;

    const pad2 = (n) => String(n).padStart(2, "0");

    // проставим текущие значения из ticket (пришли из backend)
    const initialDate = "{{ deadline_date or '' }}";
    const initialTime = "{{ deadline_time4 or '' }}";

    if (initialDate) dateEl.value = initialDate;
    if (initialTime) timeEl.value = initialTime;

    function parseTime(value) {
      const digits = (value || "").replace(/\D/g, "").slice(0, 4);
      if (!digits) return null;

      let hh = 0, mm = 0;
      if (digits.length <= 2) {
        hh = parseInt(digits, 10);
        mm = 0;
      } else {
        const padded = digits.padStart(4, "0");
        hh = parseInt(padded.slice(0, 2), 10);
        mm = parseInt(padded.slice(2, 4), 10);
      }
      hh = Math.min(23, hh || 0);
      mm = Math.min(59, mm || 0);
      return { hh, mm };
    }

    function render() {
      const parsed = parseTime(timeEl.value);
      if (!parsed) { prettyEl.textContent = "--:--"; return; }
      prettyEl.textContent = `${pad2(parsed.hh)}:${pad2(parsed.mm)}`;
    }

    timeEl.addEventListener("input", () => {
      timeEl.value = (timeEl.value || "").replace(/\D/g, "").slice(0, 4);
      render();
    });

    timeEl.addEventListener("blur", () => {
      const parsed = parseTime(timeEl.value);
      if (!parsed) return;
      timeEl.value = `${pad2(parsed.hh)}${pad2(parsed.mm)}`;
      render();
    });

    render();
  })();
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector('form[action*="/web/tickets/"][action$="/edit"]');
  const titleInput = document.querySelector("input.ticket-title-input");
  if (!form || !titleInput) return;

  const limit = parseInt(titleInput.dataset.titleLimit || "255", 10);
  const counterId = titleInput.dataset.counterTarget || "";
  const counter = counterId ? document.getElementById(counterId) : null;

  function renderCounter() {
    const len = (titleInput.value || "").length;
    const tooLong = len > limit;
    if (counter) {
      counter.textContent = `${len}/${limit}`;
      counter.classList.toggle("text-danger", tooLong);
    }
    titleInput.classList.toggle("is-invalid", tooLong);
    titleInput.setCustomValidity(tooLong ? `Максимум ${limit} символов` : "");
  }

  titleInput.addEventListener("input", renderCounter);
  form.addEventListener("submit", function (event) {
    renderCounter();
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
    }
    form.classList.add("was-validated");
  });

  renderCounter();
});
</script>
<script src="/static/sw-register.js"></script>
<script src="/static/notifications-widget.js"></script>
</body>
</html>
