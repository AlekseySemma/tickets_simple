<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Регистрация компании</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f9d8f">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/service-theme.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5 service-shell auth-shell" style="max-width: 600px;">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <div class="auth-brand">servora</div>
        <h3 class="mb-3">Регистрация компании</h3>

        {% if success %}
          <div class="alert alert-success">Компания и профиль владельца созданы. Теперь можно войти.</div>
          <a class="btn btn-primary w-100" href="/web/login">Перейти ко входу</a>
        {% else %}
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <form method="post" action="/web/register-company">
            <div class="mb-3">
              <label class="form-label">Название компании</label>
              <input name="company_name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Ваше имя</label>
              <input name="admin_name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email владельца</label>
              <input name="admin_email" type="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Пароль</label>
              <input name="admin_password" type="password" class="form-control" required />
            </div>
            <button class="btn btn-primary w-100">Зарегистрировать компанию</button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
  <script src="/static/sw-register.js"></script>
</body>
</html>
