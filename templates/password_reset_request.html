<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Сброс пароля</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f9d8f">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/service-theme.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5 service-shell auth-shell" style="max-width: 560px;">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <div class="auth-brand">servora</div>
        <h3 class="mb-3">Сброс пароля</h3>

        {% if success %}
          <div class="alert alert-success">{{ message }}</div>
          <a class="btn btn-primary w-100" href="/web/login">Перейти ко входу</a>
        {% else %}
          <div class="text-muted mb-3">Введите email аккаунта, и мы отправим ссылку для смены пароля.</div>
          <form method="post" action="/web/password-reset">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input name="email" type="email" class="form-control" required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Отправить ссылку</button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
  <script src="/static/sw-register.js"></script>
</body>
</html>
